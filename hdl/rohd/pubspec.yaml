name: particle_rohd
description: >-
  Synthesizable 32-bit RISC core with 16-bit instructions, single-cycle shadow
  register bank, and multi-core streaming FIFO interconnect implemented natively
  in Intel ROHD.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  rohd: ^0.5.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
